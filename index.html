<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-K82E341VNT"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-K82E341VNT");
    </script>
  </head>
  <body>
    <div class="app">
      <h1 class="app-title">Weather App</h1>

      <!-- Search -->
      <div class="search-container">
        <input
          type="text"
          id="cityInput"
          class="city-input"
          placeholder="Search for city name..."
          autocomplete="off"
        />
        <button id="btnSearch" class="btn-search">Search</button>
      </div>

      <!-- Error -->
      <div id="errorMessage" class="error-message hidden"></div>

      <!-- Loading -->
      <div id="loadingState" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading weather data...</p>
      </div>

      <!-- Weather Card -->
      <div id="weatherCard" class="weather-card hidden">
        <div class="city-name" id="cityName"></div>
        <div class="weather-main">
          <img
            id="weatherIcon"
            class="weather-icon"
            src=""
            alt="weather icon"
          />
          <div class="temperature" id="temperature"></div>
        </div>
        <div class="weather-desc" id="weatherDesc"></div>
        <div class="weather-details">
          <div class="detail-item">
            <span class="detail-icon">💧</span>
            <span id="humidity" class="detail-value"></span>
            <span class="detail-label">Humidity</span>
          </div>
          <div class="detail-item">
            <span class="detail-icon">🎐</span>
            <span id="windSpeed" class="detail-value"></span>
            <span class="detail-label">Wind</span>
          </div>
          <div class="detail-item">
            <span class="detail-icon">🌡️</span>
            <span id="feelsLike" class="detail-value"></span>
            <span class="detail-label">Feels Like</span>
          </div>
        </div>
      </div>

      <!-- Recent Searches -->
      <div id="recentSearches" class="recent-searches hidden">
        <p class="recent-title">Recent searches:</p>
        <div id="recentList" class="recent-list"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
