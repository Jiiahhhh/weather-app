<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-WSZKG239");
    </script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-WSZKG239"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="app">
      <h1 class="app-title">Weather App</h1>

      <!-- Search -->
      <div class="search-container">
        <input
          type="text"
          id="cityInput"
          class="city-input"
          placeholder="Search for city name..."
          autocomplete="off"
        />
        <button id="btnSearch" class="btn-search">Search</button>
      </div>

      <!-- Error -->
      <div id="errorMessage" class="error-message hidden"></div>

      <!-- Loading -->
      <div id="loadingState" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading weather data...</p>
      </div>

      <!-- Weather Card -->
      <div id="weatherCard" class="weather-card hidden">
        <div class="city-name" id="cityName"></div>
        <div class="weather-main">
          <img
            id="weatherIcon"
            class="weather-icon"
            src=""
            alt="weather icon"
          />
          <div class="temperature" id="temperature"></div>
        </div>
        <div class="weather-desc" id="weatherDesc"></div>
        <div class="weather-details">
          <div class="detail-item">
            <span class="detail-icon">💧</span>
            <span id="humidity" class="detail-value"></span>
            <span class="detail-label">Humidity</span>
          </div>
          <div class="detail-item">
            <span class="detail-icon">🎐</span>
            <span id="windSpeed" class="detail-value"></span>
            <span class="detail-label">Wind</span>
          </div>
          <div class="detail-item">
            <span class="detail-icon">🌡️</span>
            <span id="feelsLike" class="detail-value"></span>
            <span class="detail-label">Feels Like</span>
          </div>
        </div>
      </div>

      <!-- Recent Searches -->
      <div id="recentSearches" class="recent-searches hidden">
        <p class="recent-title">Recent searches:</p>
        <div id="recentList" class="recent-list"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
